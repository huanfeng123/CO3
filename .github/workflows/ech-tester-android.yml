name: Build ECH tester APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ech-tester/**"
      - ".github/workflows/ech-tester-android.yml"

permissions:
  contents: write

env:
  NDK_VERSION: "27.1.12297006"

jobs:
  build:
    name: arm64-v8a APK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Test Go ECH engine
        working-directory: ech-tester/ech
        run: go test ./...

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Build ECH gomobile AAR
        working-directory: ech-tester/ech
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          go get golang.org/x/mobile/bind@latest
          export PATH="${PATH}:$(go env GOPATH)/bin"
          mkdir -p ../android/app/libs
          gomobile bind -v -target=android/arm64 -androidapi 24 \
            -o ../android/app/libs/echtester.aar ./echtester

      - name: Build release APK
        id: gradle-build
        working-directory: ech-tester/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee gradle-build.log

      - name: Publish temporary Gradle log branch
        if: failure() && steps.gradle-build.conclusion == 'failure'
        working-directory: ech-tester/android
        env:
          DEBUG_BRANCH: "ech-tester-debug-${{ github.run_id }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp gradle-build.log "../../gradle-build-${GITHUB_RUN_ID}.log"
          git add "../../gradle-build-${GITHUB_RUN_ID}.log"
          git commit -m "ci: temporary ECH tester Gradle log"
          git push origin "HEAD:refs/heads/${DEBUG_BRANCH}"

      - name: Rename and verify single ABI artifact
        run: |
          cp ech-tester/android/app/build/outputs/apk/release/app-release.apk ech-tester-arm64-v8a.apk
          unzip -l ech-tester-arm64-v8a.apk > apk-files.txt
          grep -q "lib/arm64-v8a/" apk-files.txt
          if grep -Eq "lib/(armeabi-v7a|x86|x86_64)/" apk-files.txt; then
            echo "Unexpected non-arm64 native library found"
            exit 1
          fi

      - name: Upload one APK
        uses: actions/upload-artifact@v4
        with:
          name: ech-tester-arm64-v8a
          path: ech-tester-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30
